<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Invent Bot</title>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>The bot is loading...</p>

    <script>
      (function(d, t) {
          var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
          g.src = "https://cdn.invent.ai/widget/index.js"; 
          g.onload = function() {
              window.InventWidget.init({
                  assistantId: 'ast_0ytCPYWRjnJhQ28KtRjKHG' // Sirf ID rakhi hai, baki sab hata diya!
              });
          };
          s.parentNode.insertBefore(g, s);
      }(document, 'script'));
    </script>

</body>
</html>
